name: CI Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 같은 브랜치·PR에서 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  # 변경 감지: 이전 커밋의 CI 결과를 읽는다
  actions: read

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 검사 대상은 "이번 push에서 바뀐 파일"로 고른다. 문서만 고친 커밋은 검사를 건너뛴다.
      # - PR에 커밋을 이어 올리면(이전 head가 새 head의 조상) 이전 head와 비교한다.
      #   단, 이전 head의 CI가 통과했을 때만이다. 이전 실행이 취소·실패·진행 중이면 PR 전체와 비교한다
      #   (새 push가 이전 실행을 취소하므로, 확인하지 않으면 검사 안 된 코드가 건너뛰어진다)
      # - PR을 처음 열거나 rebase·강제 push로 이력이 바뀌면 PR 전체(develop과 갈라진 지점부터)와 비교한다
      # - main·develop push는 이전 커밋과 비교한다 (이전이 없거나 그 CI가 통과하지 않았으면 전체 검사)
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          # 그 커밋의 이 워크플로 실행 중 성공한 것이 있는가
          passed() {
            n=$(gh api "repos/$REPO/actions/runs?head_sha=$1&per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"$WORKFLOW\" and .conclusion == \"success\")] | length" 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ]
          }
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            head="$PR_HEAD"
            if [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git merge-base --is-ancestor "$BEFORE" "$head" 2>/dev/null && passed "$BEFORE"; then
              base="$BEFORE"
            else
              base=$(git merge-base "$PR_BASE" "$head")
            fi
          else
            head="$PUSH_HEAD"
            base="$BEFORE"
            # 이전 커밋이 검사를 통과하지 않았으면(취소 등) 전체 검사
            if ! passed "$BEFORE"; then base=""; fi
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "비교 기준이 없어 전체 검사를 실행합니다."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "$head")
          echo "비교: $base..$head"
          echo "$files"
          # 커밋된 스키마만 바뀌어도 백엔드 결과와 같은지 확인한다 (decisions F19)
          if echo "$files" | grep -qE '^(apps/backend/|apps/frontend/openapi\.json$|infra/postgres/|\.github/workflows/ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(apps/frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend-checks:
    name: Backend Lint & TypeCheck & ImportRules & Test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      # 로컬 docker-compose.yml과 같은 계정. 통합 테스트는 TEST_DATABASE_URL의 DB를 사용한다.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oz
          POSTGRES_PASSWORD: oz
          POSTGRES_DB: oz_backoffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oz -d oz_backoffice_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3 에뮬레이터 (로컬 compose와 같은 이미지·인증 강제, decisions R7).
      # 테스트 버킷은 tests/integration/storage/conftest.py가 만든다
      s3:
        image: floci/floci:2.4.0
        env:
          FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
        ports:
          - 4566:4566
    env:
      TEST_DATABASE_URL: postgres://oz:oz@localhost:5432/oz_backoffice_test
      TEST_S3_ENDPOINT_URL: http://localhost:4566
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --frozen --group dev
      # mypy 증분 캐시: 바뀐 모듈만 다시 검사한다. 커밋마다 새로 저장하고 가장 가까운 캐시에서 시작한다
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: apps/backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock') }}-
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (src, strict)
        run: uv run mypy
      - name: Mypy (tests)
        run: uv run mypy tests
      - name: Import rules (import-linter)
        run: uv run lint-imports
      # 프론트 타입 생성의 원본인 스키마 파일이 지금 백엔드와 같은지 (decisions F19)
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.cli export-openapi > "$RUNNER_TEMP/openapi.json"
          if ! cmp -s "$RUNNER_TEMP/openapi.json" ../frontend/openapi.json; then
            echo "::error::apps/frontend/openapi.json이 백엔드 API와 다릅니다. apps/frontend에서 npm run api:schema && npm run api:gen 후 커밋하세요."
            diff -u ../frontend/openapi.json "$RUNNER_TEMP/openapi.json" | head -80
            exit 1
          fi
      # floci 이미지에는 헬스체크 도구가 없어 서비스 옵션 대신 여기서 응답을 기다린다
      - name: Wait for S3 emulator
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4566 && exit 0
            sleep 1
          done
          echo "S3 에뮬레이터가 60초 안에 응답하지 않았습니다." >&2
          exit 1
      # 테스트 DB와 확장(btree_gist)은 tests/conftest.py가 세션마다 새로 만든다
      - name: Pytest (unit + api + integration) with coverage
        run: uv run coverage run -m pytest -q
      - name: Coverage report
        run: uv run coverage report

  frontend-checks:
    name: Frontend Lint & TypeCheck & Test & Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      # 빌드에 필요한 백엔드 주소 (E2E는 preview 주소로 API를 모킹한다 — playwright.config.ts)
      VITE_BACKEND_URL: http://localhost:4173
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Format (prettier)
        run: npm run format:check
      # 커밋된 API 타입이 커밋된 스키마로 다시 만든 결과와 같은지 (decisions F19)
      - name: API types are up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/schema.gen.ts || {
            echo "::error::src/api/schema.gen.ts가 openapi.json과 다릅니다. npm run api:gen 후 커밋하세요."
            exit 1
          }
      - name: TypeCheck
        run: npm run typecheck
      - name: Unit test (vitest)
        run: npm test
      - name: Build
        run: npm run build

  # E2E는 정적 검사와 따로 실행한다. Playwright 공식 컨테이너에 브라우저와 시스템 라이브러리가 있어
  # apt 설치(가끔 3~6분 걸렸다)가 없다. 이미지 버전은 package-lock의 @playwright/test와 같아야 한다
  frontend-e2e:
    name: Frontend E2E
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    env:
      VITE_BACKEND_URL: http://localhost:4173
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Playwright version matches container
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if [ "$version" != "1.65.1" ]; then
            echo "::error::@playwright/test $version와 컨테이너 이미지(v1.65.1)가 다릅니다. ci.yml의 이미지 태그와 이 검사를 함께 올리세요."
            exit 1
          fi
      # 한 번만 빌드한다 — CI에서 webServer는 빌드 없이 preview만 띄운다 (playwright.config.ts)
      - name: Build
        run: npm run build
      # 빌드 결과를 vite preview로 띄워 확인한다 (백엔드 API는 테스트에서 모킹)
      - name: E2E (playwright)
        run: npm run e2e
