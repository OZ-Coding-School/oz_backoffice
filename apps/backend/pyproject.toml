[project]
name = "oz-backoffice-backend"
version = "0.1.0"
description = "OZ 통합 백오피스 백엔드"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aerich>=0.10.1",
    "aioboto3>=15.5.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyairtable>=3.5.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tortoise-orm[asyncpg]>=1.1.9",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.17.2",
    "fakeredis>=2.40.0",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-aioboto3[s3]~=15.5.0",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ----------------------------------------------
# ruff
# ----------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# aerich가 생성하는 마이그레이션 파일(SQL 문자열)은 린트·포맷 대상에서 제외한다
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글 주석/문자열의 모호한 유니코드 경고 제외

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ----------------------------------------------
# mypy
# ----------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aerich.*", "taskiq_redis.*", "fakeredis.*"]
ignore_missing_imports = true

# ----------------------------------------------
# pytest / coverage
# ----------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "unit: DB 없이 도는 도메인/서비스 테스트",
    "integration: 실제 PostgreSQL이 필요한 테스트 (TEST_DATABASE_URL)",
    "api: HTTP 레벨 테스트",
]
filterwarnings = [
    "ignore:Module .* has no models:RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ----------------------------------------------
# aerich (Tortoise 마이그레이션)
# ----------------------------------------------
[tool.aerich]
tortoise_orm = "app.core.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./src"

# ----------------------------------------------
# import-linter (계층 의존 규칙)
# ----------------------------------------------
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "컨텍스트 내부 계층: presentation → (application | infrastructure) → domain"
type = "layers"
containers = [
    "app.contexts.identity",
    "app.contexts.access",
    "app.contexts.organization",
    "app.contexts.academy",
    "app.contexts.educator",
    "app.contexts.mentoring",
    "app.contexts.audit",
]
layers = ["presentation", "application | infrastructure", "domain"]

[[tool.importlinter.contracts]]
name = "도메인은 프레임워크/인프라를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.*.domain", "app.shared"]
forbidden_modules = ["fastapi", "starlette", "tortoise", "redis", "httpx", "taskiq", "app.core", "app.integrations"]

[[tool.importlinter.contracts]]
name = "공통 계층(core/shared/integrations)은 컨텍스트를 import하지 않는다"
type = "forbidden"
source_modules = ["app.core", "app.shared", "app.integrations"]
forbidden_modules = ["app.contexts"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 identity의 내부(infrastructure/presentation)를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.access", "app.contexts.organization", "app.contexts.academy", "app.contexts.educator", "app.contexts.mentoring", "app.contexts.audit"]
forbidden_modules = ["app.contexts.identity.infrastructure", "app.contexts.identity.presentation"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 access의 infrastructure를 import하지 않는다 (presentation 의존성은 공개)"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.organization", "app.contexts.academy", "app.contexts.educator", "app.contexts.mentoring", "app.contexts.audit"]
forbidden_modules = ["app.contexts.access.infrastructure"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 organization의 내부를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.access", "app.contexts.academy", "app.contexts.educator", "app.contexts.mentoring", "app.contexts.audit"]
forbidden_modules = ["app.contexts.organization.infrastructure", "app.contexts.organization.presentation"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 academy의 내부를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.access", "app.contexts.organization", "app.contexts.educator", "app.contexts.mentoring", "app.contexts.audit"]
forbidden_modules = ["app.contexts.academy.infrastructure", "app.contexts.academy.presentation"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 educator의 내부를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.access", "app.contexts.organization", "app.contexts.academy", "app.contexts.mentoring", "app.contexts.audit"]
forbidden_modules = ["app.contexts.educator.infrastructure", "app.contexts.educator.presentation"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 mentoring의 내부를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.access", "app.contexts.organization", "app.contexts.academy", "app.contexts.educator", "app.contexts.audit"]
forbidden_modules = ["app.contexts.mentoring.infrastructure", "app.contexts.mentoring.presentation"]

[[tool.importlinter.contracts]]
name = "다른 컨텍스트는 audit의 내부를 import하지 않는다"
type = "forbidden"
source_modules = ["app.contexts.identity", "app.contexts.access", "app.contexts.organization", "app.contexts.academy", "app.contexts.educator", "app.contexts.mentoring"]
forbidden_modules = ["app.contexts.audit.infrastructure", "app.contexts.audit.presentation"]
